<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SulSafe | Redefinir senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --verde: #2E7D32;
            --verde-escuro: #1B5E20;
            --verde-bg: #E8F5E9;
            --texto: #1A1A1A;
            --texto-sec: #555;
            --borda: #E0E0E0;
            --erro: #C62828;
            --ok: #2E7D32;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #fff 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--texto);
        }
        .login-container {
            background: #fff;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 24px 48px rgba(0,0,0,.12);
            border: 1px solid var(--borda);
        }
        .login-logo { text-align: center; margin-bottom: 28px; }
        .login-logo i {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background: var(--verde);
            color: #fff;
            font-size: 28px;
            margin-bottom: 14px;
        }
        .login-logo h1 { font-size: 26px; font-weight: 800; color: var(--verde-escuro); }
        .login-logo p { color: var(--texto-sec); font-size: 14px; margin-top: 6px; line-height: 1.5; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--texto-sec); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--borda);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #FAFAFA;
            transition: border-color .2s, background .2s;
        }
        .form-group input:focus { outline: none; border-color: var(--verde); background: #fff; }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            background: var(--verde);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background .2s, transform .2s;
        }
        .btn:hover:not(:disabled) { background: var(--verde-escuro); transform: translateY(-1px); }
        .btn:disabled { opacity: .7; cursor: wait; }
        .msg {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
        }
        .msg.on { display: block; }
        .msg.err { background: #FDECEA; color: var(--erro); border: 1px solid #F5C6C0; }
        .msg.ok { background: var(--verde-bg); color: var(--verde-escuro); border: 1px solid #C8E6C9; }
        .form-footer { text-align: center; margin-top: 20px; font-size: 13px; }
        .form-footer a { color: var(--verde); font-weight: 600; text-decoration: none; }
        .form-footer a:hover { text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="login-logo">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <h1>Redefinir senha</h1>
            <p>Crie uma nova senha para acessar sua conta SulSafe.</p>
        </div>

        <form id="frmReset" class="hidden" novalidate>
            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <input id="novaSenha" type="password" minlength="6" maxlength="72"
                    autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar nova senha</label>
                <input id="confirmarSenha" type="password" minlength="6" maxlength="72"
                    autocomplete="new-password" required>
            </div>
            <button id="btnReset" class="btn" type="submit">
                <i class="fas fa-check" aria-hidden="true"></i>
                <span>Salvar nova senha</span>
            </button>
        </form>

        <div id="msg" class="msg" role="status" aria-live="polite"></div>

        <div class="form-footer">
            <a href="login.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar para o login</a>
        </div>
    </main>

    <script type="module">
        import { sb } from './js/supabase-client.js'

        const form = document.getElementById('frmReset')
        const senha = document.getElementById('novaSenha')
        const confirmar = document.getElementById('confirmarSenha')
        const botao = document.getElementById('btnReset')
        const msg = document.getElementById('msg')

        let sessaoRecuperacao = null
        let eventoRecuperacao = null

        function mostrarMensagem(texto, tipo = 'err') {
            msg.textContent = texto
            msg.className = `msg ${tipo} on`
        }

        function limparUrlSensivel() {
            try {
                history.replaceState({}, document.title, window.location.pathname)
            } catch (error) {
                console.warn('Não foi possível limpar a URL:', error)
            }
        }

        function aguardarEventoRecuperacao() {
            if (eventoRecuperacao) return eventoRecuperacao

            eventoRecuperacao = new Promise(resolve => {
                const limite = setTimeout(() => resolve(null), 4000)
                const { data } = sb.auth.onAuthStateChange((event, session) => {
                    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
                        clearTimeout(limite)
                        data.subscription.unsubscribe()
                        resolve(session)
                    }
                })
            })

            return eventoRecuperacao
        }

        async function obterSessaoRecuperacao() {
            const evento = aguardarEventoRecuperacao()
            const { data, error } = await sb.auth.getSession()

            if (error) throw error
            if (data.session) return data.session

            return evento
        }

        async function iniciar() {
            try {
                const sessao = await obterSessaoRecuperacao()

                if (!sessao) {
                    mostrarMensagem(
                        'Link de recuperação inválido ou expirado. Solicite um novo email de recuperação.'
                    )
                    return
                }

                const { data, error } = await sb.auth.getUser()

                if (error || !data?.user) {
                    mostrarMensagem(
                        'Link de recuperação inválido ou expirado. Solicite um novo email de recuperação.'
                    )
                    return
                }

                sessaoRecuperacao = sessao
                form.classList.remove('hidden')
                senha.focus()
            } catch (error) {
                console.warn('Falha ao validar recuperação:', error)
                mostrarMensagem(
                    'Não foi possível validar o link de recuperação. Solicite um novo email.'
                )
            } finally {
                limparUrlSensivel()
            }
        }

        form.addEventListener('submit', async event => {
            event.preventDefault()

            if (!sessaoRecuperacao) {
                mostrarMensagem('Sessão de recuperação inválida. Solicite um novo email.')
                return
            }

            const nova = senha.value
            const confirmacao = confirmar.value

            if (nova.length < 6 || nova.length > 72) {
                mostrarMensagem('A senha deve ter entre 6 e 72 caracteres.')
                return
            }

            if (nova !== confirmacao) {
                mostrarMensagem('As senhas não coincidem.')
                return
            }

            botao.disabled = true
            msg.className = 'msg'
            msg.textContent = ''

            try {
                const { error } = await sb.auth.updateUser({ password: nova })

                if (error) throw error

                senha.value = ''
                confirmar.value = ''
                sessaoRecuperacao = null
                form.classList.add('hidden')
                mostrarMensagem(
                    'Senha alterada com sucesso. Você já pode entrar com a nova senha.',
                    'ok'
                )

                await sb.auth.signOut()
            } catch (error) {
                console.warn('Falha ao redefinir senha:', error)
                mostrarMensagem(
                    'Não foi possível alterar a senha. O link pode ter expirado; solicite um novo email.'
                )
            } finally {
                botao.disabled = false
            }
        })

        iniciar()
    </script>
</body>
</html>
