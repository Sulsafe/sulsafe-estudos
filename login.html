<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SulSafe | Portal do Aluno & Treinamentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS do Dashboard e Sistema Completo -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="acessibilidade.css">

    <!-- Chart.js para Métricas e Boletim -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --verde: #2E7D32;
            --verde-escuro: #1B5E20;
            --verde-claro: #43A047;
            --verde-bg: #E8F5E9;
            --dourado: #C9B037;
            --texto: #1A1A1A;
            --texto-sec: #555;
            --borda: #E0E0E0;
            --branco: #FFFFFF;
            --radius: 16px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        body.dash-active {
            display: block !important;
            padding: 0 !important;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg, #f4f7f6) !important;
        }
        body.dash-active #authWrap {
            display: none !important;
        }
        .login-container {
            background: #fff;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 24px 48px rgba(0,0,0,.12);
            border: 1px solid var(--borda);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background: var(--verde);
            padding: 8px;
            margin-bottom: 12px;
            object-fit: contain;
        }
        .login-logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--verde-escuro);
            letter-spacing: -1px;
        }
        .login-logo p {
            color: var(--texto-sec);
            font-size: 14px;
            margin-top: 4px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--verde-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: all .25s;
            background: transparent;
            color: var(--texto-sec);
            border: none;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #fff;
            color: var(--verde-escuro);
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-sec);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--borda);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color .2s;
            background: #FAFAFA;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--verde);
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            background: var(--verde);
            color: #fff;
            border: none;
            transition: all .25s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: var(--verde-escuro);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46,125,50,.35);
        }
        .btn-gold {
            background: var(--dourado);
            color: var(--verde-escuro);
        }
        .btn-gold:hover { background: #A8922C; box-shadow: 0 6px 20px rgba(201,176,55,.4); }
        .form-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--texto-sec);
        }
        .form-footer a {
            color: var(--verde);
            font-weight: 600;
            text-decoration: none;
        }
        .form-footer a:hover { text-decoration: underline; }
        .terms-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--texto-sec);
        }
        .terms-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--verde);
        }
        .recaptcha-note {
            font-size: 11px;
            color: var(--texto-sec);
            text-align: center;
            margin-top: 12px;
            opacity: .7;
        }
        .off { display: none !important; }
        #authWrap { display: block; width: 100%; max-width: 440px; }
        #appWrap { display: block; width: 100%; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--texto-sec);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
            text-decoration: none;
        }
        .back-link:hover { color: var(--verde-escuro); }
    </style>
</head>
<body>

<!-- TELA DE AUTENTICAÇÃO -->
<div id="authWrap">
    <div class="login-container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar à Página Principal</a>
        
        <div class="login-logo">
            <img src="logo1.png" alt="SulSafe" onerror="this.style.display='none'">
            <h1>SulSafe</h1>
            <p>Plataforma de Estudos & Formação Técnica</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tLogin" onclick="window.showT('tLogin')">Entrar</button>
            <button class="tab-btn" data-tab="tCad" onclick="window.showT('tCad')">Cadastrar</button>
        </div>

        <!-- LOGIN -->
        <div class="tab-content active" id="tLogin">
            <form id="frmLogin">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="lEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="lPass" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn"><i class="fas fa-right-to-bracket"></i> Acessar Painel</button>
            </form>
            <div class="form-footer">
                <a href="#" onclick="window.recuperarSenha()">Esqueceu sua senha?</a>
            </div>
        </div>

        <!-- CADASTRO -->
        <div class="tab-content" id="tCad">
            <form id="frmCad">
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="cNome" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Senha (mín. 6 caracteres)</label>
                    <input type="password" id="cPass" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirmar senha</label>
                    <input type="password" id="cPass2" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="terms-row">
                        <input type="checkbox" id="cTermos" required>
                        Aceito os Termos de Uso e Política de Privacidade
                    </label>
                </div>
                <button type="submit" class="btn btn-gold"><i class="fas fa-user-plus"></i> Criar Conta de Aluno</button>
            </form>
            <div class="recaptcha-note">Ambiente seguro SulSafe Treinamentos</div>
        </div>
    </div>
</div>

<!-- DASHBOARD DO ESTUDANTE / ADMIN (SPA) -->
<div id="appWrap" class="off">
    <div id="dash" class="on">
        <aside id="appSidebar" class="sidebar"></aside>
        <main id="appContent" class="main"></main>
    </div>

    <!-- Modais Globais -->
    <div id="mdlBg" class="mdl-bg">
        <div id="mdlBox" class="mdl"></div>
    </div>

    <!-- Modal de Videoaula Integrado -->
    <div id="videoModal" class="mdl-bg">
        <div class="mdl">
            <div class="video-header">
                <span id="videoModalTitle"><i class="fas fa-play-circle"></i> Videoaula</span>
                <button class="mdl-x" onclick="window.fecharModalVideo()" title="Fechar"><i class="fas fa-times"></i></button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
            <div class="video-footer">
                <span class="progress-text" id="videoModalInfo">SulSafe Educação</span>
                <button class="btn-concluir show" id="btnConcluirAula" onclick="window.concluirAulaAtual()"><i class="fas fa-check"></i> Marcar como Concluída</button>
            </div>
        </div>
    </div>

    <!-- Container Global de Toasts -->
    <div id="toast"></div>
</div>

<!-- Scripts Modularizados -->
<script type="module" src="./js/main.js"></script>

</body>
</html>
