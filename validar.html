<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Validar Certificado | SulSafe</title>
    <meta name="description" content="Valide a autenticidade de certificados SulSafe pelo código de validação.">
    <link rel="icon" type="image/png" href="/logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(160deg, #f4f7f5 0%, #e8efea 100%);
            color: #1d2b23;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        main {
            background: #fff;
            width: 100%;
            max-width: 560px;
            border: 1px solid #d9c079;
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 18px 50px rgba(23, 76, 54, .12);
        }
        .topo { text-align: center; margin-bottom: 26px; }
        .topo img { width: 92px; height: auto; }
        .marca { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #c6a54b; font-weight: 700; }
        h1 { color: #174c36; font-size: 24px; margin: 10px 0 6px; }
        p.descricao { color: #5a6b60; font-size: 14px; line-height: 1.6; margin: 0; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd6ce;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input:focus { outline: 2px solid #174c36; outline-offset: 1px; }
        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #174c36;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        #resultado { margin-top: 24px; }
        .cartao { border-radius: 12px; padding: 18px; border: 1px solid #cbd6ce; }
        .cartao.valido { border-color: #2e7d32; background: #f1f8f2; }
        .cartao.invalido { border-color: #c62828; background: #fdf2f2; }
        .cartao h2 { margin: 0 0 10px; font-size: 18px; color: #174c36; }
        .linha { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 5px 0; }
        .linha span:first-child { color: #66776c; }
        .linha span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
        .privacidade { font-size: 11px; color: #7a8a80; margin-top: 18px; text-align: center; }
        a { color: #174c36; }
    </style>
</head>
<body>
    <main>
        <div class="topo">
            <img src="/logo1.png" alt="SulSafe">
            <div class="marca">SulSafe Treinamentos</div>
            <h1>Validar Certificado</h1>
            <p class="descricao">Informe o código/hash de validação impresso no certificado para conferir sua autenticidade.</p>
        </div>

        <form id="formValidar" novalidate>
            <label for="hashCert">Código de validação</label>
            <input id="hashCert" name="hashCert" autocomplete="off" spellcheck="false"
                   placeholder="Cole aqui o hash do certificado" required>
            <button id="btnValidar" type="submit"><i class="fas fa-shield-check"></i> Validar certificado</button>
        </form>

        <div id="resultado" aria-live="polite"></div>

        <p class="privacidade">
            A consulta pública não exibe nome, CPF ou qualquer outro dado pessoal do aluno.
            <br><a href="/">Voltar para o site SulSafe</a>
        </p>
    </main>

    <script type="module" src="/js/validar-certificado.js"></script>
</body>
</html>
